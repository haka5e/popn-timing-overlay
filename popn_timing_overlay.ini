[Overlay]
; Timing graph horizontal range. Values outside this range are clamped.
RangeMs=50
; Number of recent successful judgments retained on screen (8-128).
History=64
; Vertical position as a percentage of the game viewport.
VerticalPercent=28
; Graph width in pixels (automatically capped on small viewports).
WidthPixels=360
; Height of the GREAT/COOL judgment band in pixels.
HeightPixels=38
; Clear old samples after this many seconds without a judgment.
ResetSeconds=12
; F10 virtual-key code. Press once to hide/show the overlay.
ToggleKey=121
ShowValue=1
; Set to 1 only if EARLY/LATE appears reversed on your setup.
Invert=0

; Colors use RRGGBB hex. A leading # or 0x is also accepted.
; OverallAlpha scales every overlay element: 0=invisible, 255=fully enabled.
OverallAlpha=255
BackgroundColor=000000
BackgroundAlpha=42

; Keep the timing bar divided into GREAT | COOL | GREAT zones.
JudgeZones=1
; Exact COOL window for this game build: -22ms (EARLY) through +18ms (LATE).
CoolEarlyMs=22
CoolLateMs=18
GreatZoneColor=FF526B
GreatZoneAlpha=42
CoolZoneColor=39DCE6
CoolZoneAlpha=38
ZoneLabels=1
ZoneLabelColor=D6E2E8
ZoneLabelAlpha=125

AxisColor=82919B
CenterColor=DCE6EB
HistoryColor=1EE1E1
LatestColor=FADC50
LabelColor=9BAAB4
TextColor=D2E1E6
