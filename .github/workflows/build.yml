name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        shell: powershell
        run: .\package.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: popn_timing_overlay
          path: |
            dist/popn_timing_overlay-v1.0.0.zip
            dist/SHA256SUMS.txt

